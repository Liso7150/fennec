[package]
name = "fennec"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Qwen3.5-MoE inference engine: rabbit's int4 experts, colibri's tiered residency, fox's model formats"
license = "MIT"

[dependencies]
serde_json = "1"
memmap2 = "0.9"
libloading = "0.8"
fancy-regex = "0.13"
unicode-normalization = "0.1"
# ONNX Runtime as the portability wrapper for non-NVIDIA devices (DirectML /
# OpenVINO / CoreML). Optional: the default offline build is unchanged. The
# runtime is dlopened at run time from a signed onnxruntime.dll (load-dynamic),
# so there is no import library and no MSVC. See src/ort.rs.
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic"] }

[features]
default = []
# Enable the ORT dense backend and the execution-provider wrappers it names.
ort = ["dep:ort", "ort/directml", "ort/openvino", "ort/coreml"]

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = true
