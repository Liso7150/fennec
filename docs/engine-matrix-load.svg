<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" role="img" aria-label="Cold start — spawn until /v1/models answers" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="370" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">Cold start — spawn until /v1/models answers</text><text x="20" y="52" font-size="12" fill="#656d76">One protocol for both engines: serve + one streaming completion, 64 tokens, ctx 32768, median of 5, measured</text><text x="20" y="68" font-size="12" fill="#656d76">2026-11-13T10:40:58Z. Token counts come from usage.completion_tokens, not from counting SSE chunks.</text><text x="238" y="108.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (Vulkan)</text><rect x="250" y="94" width="540.0" height="20" rx="3" fill="#0969da"/><text x="798.0" y="110" font-size="12" font-weight="400" fill="#1f2328">26.0 s</text><text x="924" y="108.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="132" x2="900" y2="132" stroke="#d8dee4"/><text x="238" y="154.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CUDA)</text><rect x="250" y="140" width="220.2" height="20" rx="3" fill="#bc4c00"/><text x="478.2" y="156" font-size="12" font-weight="400" fill="#1f2328">10.6 s</text><text x="924" y="154.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="178" x2="900" y2="178" stroke="#d8dee4"/><text x="238" y="200.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (Vulkan)</text><rect x="250" y="186" width="282.5" height="20" rx="3" fill="#bc4c00"/><text x="540.5" y="202" font-size="12" font-weight="400" fill="#1f2328">13.6 s</text><text x="924" y="200.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="224" x2="900" y2="224" stroke="#d8dee4"/><text x="238" y="246.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="232" width="166.2" height="20" rx="3" fill="#8250df"/><text x="424.2" y="248" font-size="12" font-weight="600" fill="#1a7f37">8.0 s  fastest</text><text x="924" y="246.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="270" x2="900" y2="270" stroke="#d8dee4"/><text x="238" y="292.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CPU)</text><rect x="250" y="278" width="297.0" height="20" rx="3" fill="#bc4c00"/><text x="555.0" y="294" font-size="12" font-weight="400" fill="#1f2328">14.3 s</text><text x="924" y="292.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="316" x2="900" y2="316" stroke="#d8dee4"/><text x="250" y="354" font-size="11" fill="#656d76">seconds to ready, lower is better</text></svg>