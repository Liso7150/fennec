2" y="248" font-size="12" font-weight="400" fill="#1f2328">3.84 s</text><text x="924" y="246.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="270" x2="900" y2="270" stroke="#d8dee4"/><text x="238" y="292.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="278" width="388.9" height="20" rx="3" fill="#8250df"/><text x="646.9" y="294" font-size="12" font-weight="400" fill="#1f2328">10.14 s</text><text x="924" y="292.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="316" x2="900" y2="316" stroke="#d8dee4"/><text x="238" y="338.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CPU)</text><rect x="250" y="324" width="517.4" height="20" rx="3" fill="#bc4c00"/><text x="775.4" y="340" font-size="12" font-weight="400" fill="#1f2328">13.49 s</text><text x="924" y="338.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="362" x2="900" y2="362" stroke="#d8dee4"/><text x="238" y="384.0" text-anchor="end" font-size="13" fill="#1f2328">rabbit (CPU)</text><text x="254" y="384.0" font-size="12" fill="#656d76">not reported</text><text x="924" y="384.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="408" x2="900" y2="408" stroke="#d8dee4"/><text x="250" y="446" font-size="11" fill="#656d76">milliseconds, lower is better</text></svg>