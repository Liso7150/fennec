<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" role="img" aria-label="Time per output token" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="462" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">Time per output token</text><text x="20" y="52" font-size="12" fill="#656d76">Milliseconds per token after the first, lower is better. The mean of the decode steps only; the prompt steps are</text><text x="20" y="68" font-size="12" fill="#656d76">excluded so TTFT is not counted twice.</text><text x="238" y="108.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (Vulkan)</text><rect x="250" y="94" width="16.6" height="20" rx="3" fill="#0969da"/><text x="274.6" y="110" font-size="12" font-weight="600" fill="#1a7f37">43.2 ms  fastest</text><text x="924" y="108.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="132" x2="900" y2="132" stroke="#d8dee4"/><text x="238" y="154.0" text-anchor="end" font-size="13" fill="#1f2328">fox (Vulkan)</text><rect x="250" y="140" width="31.9" height="20" rx="3" fill="#0969da"/><text x="289.9" y="156" font-size="12" font-weight="400" fill="#1f2328">83.3 ms</text><text x="924" y="154.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="178" x2="900" y2="178" stroke="#d8dee4"/><text x="238" y="200.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CUDA)</text><rect x="250" y="186" width="31.6" height="20" rx="3" fill="#bc4c00"/><text x="289.6" y="202" font-size="12" font-weight="400" fill="#1f2328">82.4 ms</text><text x="924" y="200.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="224" x2="900" y2="224" stroke="#d8dee4"/><text x="238" y="246.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (Vulkan)</text><rect x="250" y="232" width="33.9" height="20" rx="3" fill="#bc4c00"/><text x="291.9" y="248" font-size="12" font-weight="400" fill="#1f2328">88.5 ms</text><text x="924" y="246.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="270" x2="900" y2="270" stroke="#d8dee4"/><text x="238" y="292.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="278" width="76.0" height="20" rx="3" fill="#8250df"/><text x="334.0" y="294" font-size="12" font-weight="400" fill="#1f2328">198.2 ms</text><text x="924" y="292.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="316" x2="900" y2="316" stroke="#d8dee4"/><text x="238" y="338.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CPU)</text><rect x="250" y="324" width="126.3" height="20" rx="3" fill="#bc4c00"/><text x="384.3" y="340" font-size="12" font-weight="400" fill="#1f2328">329.5 ms</text><text x="924" y="338.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="362" x2="900" y2="362" stroke="#d8dee4"/><text x="238" y="384.0" text-anchor="end" font-size="13" fill="#1f2328">rabbit (CPU)</text><rect x="250" y="370" width="540.0" height="20" rx="3" fill="#8250df"/><text x="798.0" y="386" font-size="12" font-weight="400" fill="#1f2328">1408.5 ms</text><text x="924" y="384.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="408" x2="900" y2="408" stroke="#d8dee4"/><text x="250" y="446" font-size="11" fill="#656d76">milliseconds, lower is better</text></svg>