<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 478" role="img" aria-label="Cold start — model load until the engine answers" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="478" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">Cold start — model load until the engine answers</text><text x="20" y="52" font-size="12" fill="#656d76">Same checkpoint, same machine. Fennec borrows the int4 container's packed nibbles straight out of the mapping instead</text><text x="20" y="68" font-size="12" fill="#656d76">of copying them into a host pool, which is what took its cold start from 96.9 s to 11.8 s. fox loads a pre-quantised</text><text x="20" y="84" font-size="12" fill="#656d76">GGUF and defers the rest to first touch.</text><text x="238" y="124.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (Vulkan)</text><rect x="250" y="110" width="540.0" height="20" rx="3" fill="#0969da"/><text x="798.0" y="126" font-size="12" font-weight="400" fill="#1f2328">29.7 s</text><text x="924" y="124.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="148" x2="900" y2="148" stroke="#d8dee4"/><text x="238" y="170.0" text-anchor="end" font-size="13" fill="#1f2328">fox (Vulkan)</text><rect x="250" y="156" width="44.9" height="20" rx="3" fill="#0969da"/><text x="302.9" y="172" font-size="12" font-weight="600" fill="#1a7f37">2.5 s  fastest</text><text x="924" y="170.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="194" x2="900" y2="194" stroke="#d8dee4"/><text x="238" y="216.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CUDA)</text><rect x="250" y="202" width="214.5" height="20" rx="3" fill="#bc4c00"/><text x="472.5" y="218" font-size="12" font-weight="400" fill="#1f2328">11.8 s</text><text x="924" y="216.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="240" x2="900" y2="240" stroke="#d8dee4"/><text x="238" y="262.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (Vulkan)</text><rect x="250" y="248" width="280.0" height="20" rx="3" fill="#bc4c00"/><text x="538.0" y="264" font-size="12" font-weight="400" fill="#1f2328">15.4 s</text><text x="924" y="262.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="286" x2="900" y2="286" stroke="#d8dee4"/><text x="238" y="308.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="294" width="181.8" height="20" rx="3" fill="#8250df"/><text x="439.8" y="310" font-size="12" font-weight="400" fill="#1f2328">10.0 s</text><text x="924" y="308.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="332" x2="900" y2="332" stroke="#d8dee4"/><text x="238" y="354.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CPU)</text><rect x="250" y="340" width="98.2" height="20" rx="3" fill="#bc4c00"/><text x="356.2" y="356" font-size="12" font-weight="400" fill="#1f2328">5.4 s</text><text x="924" y="354.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="378" x2="900" y2="378" stroke="#d8dee4"/><text x="238" y="400.0" text-anchor="end" font-size="13" fill="#1f2328">rabbit (CPU)</text><rect x="250" y="386" width="116.4" height="20" rx="3" fill="#8250df"/><text x="374.4" y="402" font-size="12" font-weight="400" fill="#1f2328">6.4 s</text><text x="924" y="400.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="424" x2="900" y2="424" stroke="#d8dee4"/><text x="250" y="462" font-size="11" fill="#656d76">seconds to first ready token, lower is better</text></svg>