<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" role="img" aria-label="The GPU kernel: Fennec's hand-written PTX vs ONNX Runtime's CUDA EP" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="310" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">The GPU kernel: Fennec's hand-written PTX vs ONNX Runtime's CUDA EP</text><text x="20" y="52" font-size="12" fill="#656d76">lm_head, 248320x2048, on the RTX 4060. ORT's CUDA EP computes F16 natively (f32 is ~1.8x the f16 time), unlike its CPU</text><text x="20" y="68" font-size="12" fill="#656d76">EP. onnxruntime-gpu 1.32.0 with CUDA 13 / cuDNN 9 from PyPI wheels, every DLL Authenticode Valid under Smart App</text><text x="20" y="84" font-size="12" fill="#656d76">Control. Fennec from FENNEC_PROFILE=1 serve decode, median of 3x64 tokens. The two are level: ORT is 1.05x ahead on</text><text x="20" y="100" font-size="12" fill="#656d76">the dominant kernel.</text><text x="238" y="140.0" text-anchor="end" font-size="13" fill="#1f2328">ORT CUDA EP (F16 native)</text><rect x="250" y="126" width="294.4" height="20" rx="3" fill="#0969da"/><text x="552.4" y="142" font-size="12" font-weight="600" fill="#1a7f37">4.98 ms  fastest</text><text x="924" y="140.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="164" x2="900" y2="164" stroke="#d8dee4"/><text x="238" y="186.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec CUDA tier (PTX, F16)</text><rect x="250" y="172" width="309.6" height="20" rx="3" fill="#bc4c00"/><text x="567.6" y="188" font-size="12" font-weight="400" fill="#1f2328">5.24 ms</text><text x="924" y="186.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="210" x2="900" y2="210" stroke="#d8dee4"/><text x="238" y="232.0" text-anchor="end" font-size="13" fill="#1f2328">ORT CUDA EP (F32)</text><rect x="250" y="218" width="540.0" height="20" rx="3" fill="#0969da"/><text x="798.0" y="234" font-size="12" font-weight="400" fill="#1f2328">9.14 ms</text><text x="924" y="232.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="256" x2="900" y2="256" stroke="#d8dee4"/><text x="250" y="294" font-size="11" fill="#656d76">milliseconds per token, lower is better</text></svg>