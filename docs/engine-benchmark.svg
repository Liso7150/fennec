<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" role="img" aria-label="Decode throughput — Qwen3.6-35B-A3B on one RTX 4060 Laptop + Core Ultra 7 155H" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="574" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">Decode throughput — Qwen3.6-35B-A3B on one RTX 4060 Laptop + Core Ultra 7 155H</text><text x="20" y="52" font-size="12" fill="#656d76">Decode throughput and end-to-end latency on the same checkpoint. Every engine ran on this one machine; threads capped</text><text x="20" y="68" font-size="12" fill="#656d76">at 8 for Fennec so the host stayed usable. rabbit is CPU-only by design. Colibri CPU is listed because it is the</text><text x="20" y="84" font-size="12" fill="#656d76">honest floor Fennec's device tier has to beat. Fennec's rows are the shipped int4 checkpoint, and each quotes the</text><text x="20" y="100" font-size="12" fill="#656d76">MEDIAN run of its repeats (5 CUDA, 3 Vulkan, 1 CPU) with the observed spread alongside; every column of a row comes</text><text x="20" y="116" font-size="12" fill="#656d76">from that one log. Fennec is not the fastest engine here: Colibri's Vulkan tier still leads on throughput, TTFT and</text><text x="20" y="132" font-size="12" fill="#656d76">total latency, by 1.71x at Fennec's median. Fennec's CUDA tier is now level with fox (11.71 against 12.00 tok/s, and</text><text x="20" y="148" font-size="12" fill="#656d76">ahead of it on TTFT by 13.5x and on total latency by 4.0x) and loads 2.5x faster than Colibri. IMPORTANT: every Fennec</text><text x="20" y="164" font-size="12" fill="#656d76">number published before 2026-11-12's decode-fidelity fix was measured on a wrong greedy continuation and is retracted</text><text x="20" y="180" font-size="12" fill="#656d76">— see fennec_decode_fidelity. The corrected device hit rate is 30.1%, not 39.3%.</text><text x="238" y="220.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (Vulkan)</text><rect x="250" y="206" width="540.0" height="20" rx="3" fill="#0969da"/><text x="798.0" y="222" font-size="12" font-weight="600" fill="#1a7f37">20.06  winner</text><text x="924" y="220.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="244" x2="900" y2="244" stroke="#d8dee4"/><text x="238" y="266.0" text-anchor="end" font-size="13" fill="#1f2328">fox (Vulkan)</text><rect x="250" y="252" width="323.0" height="20" rx="3" fill="#0969da"/><text x="581.0" y="268" font-size="12" font-weight="400" fill="#1f2328">12.00</text><text x="924" y="266.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="290" x2="900" y2="290" stroke="#d8dee4"/><text x="238" y="312.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CUDA)</text><rect x="250" y="298" width="315.2" height="20" rx="3" fill="#bc4c00"/><text x="573.2" y="314" font-size="12" font-weight="400" fill="#1f2328">11.71</text><text x="924" y="312.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="336" x2="900" y2="336" stroke="#d8dee4"/><text x="238" y="358.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (Vulkan)</text><rect x="250" y="344" width="285.6" height="20" rx="3" fill="#bc4c00"/><text x="543.6" y="360" font-size="12" font-weight="400" fill="#1f2328">10.61</text><text x="924" y="358.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="382" x2="900" y2="382" stroke="#d8dee4"/><text x="238" y="404.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="390" width="105.8" height="20" rx="3" fill="#8250df"/><text x="363.8" y="406" font-size="12" font-weight="400" fill="#1f2328">3.93</text><text x="924" y="404.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="428" x2="900" y2="428" stroke="#d8dee4"/><text x="238" y="450.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CPU)</text><rect x="250" y="436" width="80.8" height="20" rx="3" fill="#bc4c00"/><text x="338.8" y="452" font-size="12" font-weight="400" fill="#1f2328">3.00</text><text x="924" y="450.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="474" x2="900" y2="474" stroke="#d8dee4"/><text x="238" y="496.0" text-anchor="end" font-size="13" fill="#1f2328">rabbit (CPU)</text><rect x="250" y="482" width="19.1" height="20" rx="3" fill="#8250df"/><text x="277.1" y="498" font-size="12" font-weight="400" fill="#1f2328">0.71</text><text x="924" y="496.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="520" x2="900" y2="520" stroke="#d8dee4"/><text x="250" y="558" font-size="11" fill="#656d76">tokens / second, higher is better</text></svg>