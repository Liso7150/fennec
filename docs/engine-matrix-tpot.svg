<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" role="img" aria-label="Time per output token — decode window only" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="586" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">Time per output token — decode window only</text><text x="20" y="52" font-size="12" fill="#656d76">One protocol for 3 engines: serve + one streaming chat completion, 64 tokens, ctx 32768, measured</text><text x="20" y="68" font-size="12" fill="#656d76">2026-11-21T04:46:13Z. Block cells are the median of 3 runs; the ABBA lanes are the median of 4 alternating visits.</text><text x="20" y="84" font-size="12" fill="#656d76">Token counts come from usage.completion_tokens, not from counting SSE chunks. llama.cpp rows load a Q4_K_M GGUF of the</text><text x="20" y="100" font-size="12" fill="#656d76">same checkpoint, the others the suite's int4 container.</text><text x="238" y="140.0" text-anchor="end" font-size="13" fill="#1f2328">llama.cpp (CUDA)</text><rect x="250" y="126" width="56.0" height="20" rx="3" fill="#0969da"/><text x="314.0" y="142" font-size="12" font-weight="600" fill="#1a7f37">47.3 ms  fastest</text><text x="924" y="140.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="164" x2="900" y2="164" stroke="#d8dee4"/><text x="238" y="186.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec (CUDA)</text><rect x="250" y="172" width="72.8" height="20" rx="3" fill="#bc4c00"/><text x="330.8" y="188" font-size="12" font-weight="400" fill="#1f2328">61.4 ms</text><text x="924" y="186.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="210" x2="900" y2="210" stroke="#d8dee4"/><text x="238" y="232.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec (Vulkan)</text><rect x="250" y="218" width="78.2" height="20" rx="3" fill="#bc4c00"/><text x="336.2" y="234" font-size="12" font-weight="400" fill="#1f2328">66.0 ms</text><text x="924" y="232.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="256" x2="900" y2="256" stroke="#d8dee4"/><text x="238" y="278.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (Vulkan)</text><rect x="250" y="264" width="100.4" height="20" rx="3" fill="#0969da"/><text x="358.4" y="280" font-size="12" font-weight="400" fill="#1f2328">84.7 ms</text><text x="924" y="278.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="302" x2="900" y2="302" stroke="#d8dee4"/><text x="238" y="324.0" text-anchor="end" font-size="13" fill="#1f2328">llama.cpp (CPU)</text><rect x="250" y="310" width="156.2" height="20" rx="3" fill="#8250df"/><text x="414.2" y="326" font-size="12" font-weight="400" fill="#1f2328">131.7 ms</text><text x="924" y="324.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="348" x2="900" y2="348" stroke="#d8dee4"/><text x="238" y="370.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec (CPU)</text><rect x="250" y="356" width="170.3" height="20" rx="3" fill="#bc4c00"/><text x="428.3" y="372" font-size="12" font-weight="400" fill="#1f2328">143.6 ms</text><text x="924" y="370.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="394" x2="900" y2="394" stroke="#d8dee4"/><text x="238" y="416.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="402" width="200.9" height="20" rx="3" fill="#8250df"/><text x="458.9" y="418" font-size="12" font-weight="400" fill="#1f2328">169.4 ms</text><text x="924" y="416.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="440" x2="900" y2="440" stroke="#d8dee4"/><text x="238" y="462.0" text-anchor="end" font-size="13" fill="#1f2328">llama.cpp (Vulkan)</text><rect x="250" y="448" width="493.5" height="20" rx="3" fill="#0969da"/><text x="751.5" y="464" font-size="12" font-weight="400" fill="#1f2328">416.2 ms</text><text x="924" y="462.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="486" x2="900" y2="486" stroke="#d8dee4"/><text x="238" y="508.0" text-anchor="end" font-size="13" fill="#1f2328">llama.cpp (Vulkan -cmoe)</text><rect x="250" y="494" width="540.0" height="20" rx="3" fill="#0969da"/><text x="798.0" y="510" font-size="12" font-weight="400" fill="#1f2328">455.4 ms</text><text x="924" y="508.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="532" x2="900" y2="532" stroke="#d8dee4"/><text x="250" y="570" font-size="11" fill="#656d76">milliseconds, lower is better</text></svg>