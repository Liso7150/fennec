<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" role="img" aria-label="Time to first token" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="462" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">Time to first token</text><text x="20" y="52" font-size="12" fill="#656d76">Milliseconds from the prompt arriving to the first output token, lower is better. Fennec walks the prompt one position</text><text x="20" y="68" font-size="12" fill="#656d76">at a time, so this is the sum of the prompt-length steps, not a separate prefill pass.</text><text x="238" y="108.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (Vulkan)</text><rect x="250" y="94" width="22.2" height="20" rx="3" fill="#0969da"/><text x="280.2" y="110" font-size="12" font-weight="600" fill="#1a7f37">0.47 s  fastest</text><text x="924" y="108.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="132" x2="900" y2="132" stroke="#d8dee4"/><text x="238" y="154.0" text-anchor="end" font-size="13" fill="#1f2328">fox (Vulkan)</text><rect x="250" y="140" width="540.0" height="20" rx="3" fill="#0969da"/><text x="798.0" y="156" font-size="12" font-weight="400" fill="#1f2328">11.41 s</text><text x="924" y="154.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="178" x2="900" y2="178" stroke="#d8dee4"/><text x="238" y="200.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CUDA)</text><rect x="250" y="186" width="39.9" height="20" rx="3" fill="#bc4c00"/><text x="297.9" y="202" font-size="12" font-weight="400" fill="#1f2328">0.84 s</text><text x="924" y="200.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="224" x2="900" y2="224" stroke="#d8dee4"/><text x="238" y="246.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (Vulkan)</text><rect x="250" y="232" width="47.6" height="20" rx="3" fill="#bc4c00"/><text x="305.6" y="248" font-size="12" font-weight="400" fill="#1f2328">1.01 s</text><text x="924" y="246.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="270" x2="900" y2="270" stroke="#d8dee4"/><text x="238" y="292.0" text-anchor="end" font-size="13" fill="#1f2328">Colibri (CPU)</text><rect x="250" y="278" width="179.8" height="20" rx="3" fill="#8250df"/><text x="437.8" y="294" font-size="12" font-weight="400" fill="#1f2328">3.80 s</text><text x="924" y="292.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="316" x2="900" y2="316" stroke="#d8dee4"/><text x="238" y="338.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec 2.5.0 (CPU)</text><rect x="250" y="324" width="139.5" height="20" rx="3" fill="#bc4c00"/><text x="397.5" y="340" font-size="12" font-weight="400" fill="#1f2328">2.95 s</text><text x="924" y="338.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="362" x2="900" y2="362" stroke="#d8dee4"/><text x="238" y="384.0" text-anchor="end" font-size="13" fill="#1f2328">rabbit (CPU)</text><text x="254" y="384.0" font-size="12" fill="#656d76">not reported</text><text x="924" y="384.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="408" x2="900" y2="408" stroke="#d8dee4"/><text x="250" y="446" font-size="11" fill="#656d76">milliseconds, lower is better</text></svg>