<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="The small dense work: ORT's CPU EP beats Fennec's thread budget" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="340" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">The small dense work: ORT's CPU EP beats Fennec's thread budget</text><text x="20" y="52" font-size="12" fill="#656d76">One call walks all 40 layers' distinct weights, so both sides are cache-cold — the fair version of the small-shape</text><text x="20" y="68" font-size="12" fill="#656d76">comparison. ORT 8 intra-op threads; Fennec's budget() gives the router 2 and the shared expert 4. Fennec's stages also</text><text x="20" y="84" font-size="12" fill="#656d76">include softmax/top-8 and the axpy reductions. ORT folds the F16 weights to F32 and still wins.</text><text x="238" y="124.0" text-anchor="end" font-size="13" fill="#1f2328">Routing, 40 gates — ORT CPU EP</text><rect x="250" y="110" width="64.8" height="20" rx="3" fill="#8250df"/><text x="322.8" y="126" font-size="12" font-weight="600" fill="#1a7f37">1.61 ms  fastest</text><text x="924" y="124.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="148" x2="900" y2="148" stroke="#d8dee4"/><text x="238" y="170.0" text-anchor="end" font-size="13" fill="#1f2328">Routing, 40 gates — Fennec CPU</text><rect x="250" y="156" width="164.3" height="20" rx="3" fill="#bc4c00"/><text x="422.3" y="172" font-size="12" font-weight="400" fill="#1f2328">4.07 ms</text><text x="924" y="170.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="194" x2="900" y2="194" stroke="#d8dee4"/><text x="238" y="216.0" text-anchor="end" font-size="13" fill="#1f2328">Shared expert, 40 FFNs — ORT CPU EP</text><rect x="250" y="202" width="358.2" height="20" rx="3" fill="#8250df"/><text x="616.2" y="218" font-size="12" font-weight="400" fill="#1f2328">8.88 ms</text><text x="924" y="216.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="240" x2="900" y2="240" stroke="#d8dee4"/><text x="238" y="262.0" text-anchor="end" font-size="13" fill="#1f2328">Shared expert, 40 FFNs — Fennec CPU</text><rect x="250" y="248" width="540.0" height="20" rx="3" fill="#bc4c00"/><text x="798.0" y="264" font-size="12" font-weight="400" fill="#1f2328">13.38 ms</text><text x="924" y="262.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="286" x2="900" y2="286" stroke="#d8dee4"/><text x="250" y="324" font-size="11" fill="#656d76">milliseconds per token, lower is better</text></svg>