<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 356" role="img" aria-label="The dominant dense kernel: Fennec vs ONNX Runtime's CPU EP" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="940" height="356" fill="#ffffff"/><text x="20" y="30" font-size="17" font-weight="600" fill="#1f2328">The dominant dense kernel: Fennec vs ONNX Runtime's CPU EP</text><text x="20" y="52" font-size="12" fill="#656d76">lm_head, 248320x2048, one call per token. The only like-for-like row in the lane: 1 GiB of weights is DRAM-bound on</text><text x="20" y="68" font-size="12" fill="#656d76">both sides. ORT 1.31.1 CPU EP, 8 intra-op threads, median of 30 reps after 5 warm-ups, Microsoft-signed DLL under</text><text x="20" y="84" font-size="12" fill="#656d76">Smart App Control. Fennec from FENNEC_PROFILE=1 serve decode, median of 3x64 tokens, 8 threads. ORT has no F16 MatMul</text><text x="20" y="100" font-size="12" fill="#656d76">kernel: its optimizer folds the F16 weights to F32, so the F16 cell moves twice the bytes.</text><text x="238" y="140.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec CUDA tier (F16 on device)</text><rect x="250" y="126" width="91.2" height="20" rx="3" fill="#bc4c00"/><text x="349.2" y="142" font-size="12" font-weight="600" fill="#1a7f37">5.24 ms  fastest</text><text x="924" y="140.0" text-anchor="end" font-size="11" fill="#656d76">CPU + GPU</text><line x1="250" y1="164" x2="900" y2="164" stroke="#d8dee4"/><text x="238" y="186.0" text-anchor="end" font-size="13" fill="#1f2328">Fennec CPU tier (F16 from mmap)</text><rect x="250" y="172" width="359.5" height="20" rx="3" fill="#bc4c00"/><text x="617.5" y="188" font-size="12" font-weight="400" fill="#1f2328">20.65 ms</text><text x="924" y="186.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="210" x2="900" y2="210" stroke="#d8dee4"/><text x="238" y="232.0" text-anchor="end" font-size="13" fill="#1f2328">ORT CPU EP (F32 weights)</text><rect x="250" y="218" width="509.5" height="20" rx="3" fill="#8250df"/><text x="767.5" y="234" font-size="12" font-weight="400" fill="#1f2328">29.27 ms</text><text x="924" y="232.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="256" x2="900" y2="256" stroke="#d8dee4"/><text x="238" y="278.0" text-anchor="end" font-size="13" fill="#1f2328">ORT CPU EP (F16 in, widened to F32)</text><rect x="250" y="264" width="540.0" height="20" rx="3" fill="#8250df"/><text x="798.0" y="280" font-size="12" font-weight="400" fill="#1f2328">31.02 ms</text><text x="924" y="278.0" text-anchor="end" font-size="11" fill="#656d76">CPU only</text><line x1="250" y1="302" x2="900" y2="302" stroke="#d8dee4"/><text x="250" y="340" font-size="11" fill="#656d76">milliseconds per token, lower is better</text></svg>